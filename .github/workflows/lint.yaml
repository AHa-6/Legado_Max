name: Quick Lint and Compile

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

# 确保在同一个分支上连续 push 时，取消之前的旧任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 0 = 拉全量历史：spotless ratchetFrom 与 commitlint --from 需要比较基线
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Node (commitlint)
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install JS deps (commitlint)
        # commitlint 依赖在 package-lock.json 里，CI 无本地 node_modules，需先安装
        run: npm ci --ignore-scripts

      - name: Check Commit Messages
        # 校验提交信息是否符合 Conventional Commits（本地 commit-msg 钩子的 CI 兜底）。
        #
        # ## 为什么只校验本次 push 新增的提交
        # 原先用 `--from origin/main` 做全量校验，但 origin/main 是过期引用：
        # compose-rework 上有 7 条早于 commit-msg 钩子的提交永远无法通过
        # （release: / backup: / baseline: 三个类型不在 type-enum 里，
        # 另有 3 条中文裸标题完全没有类型前缀）。全量校验因此**必然失败**，
        # 而失败会让后面第 9~12 步（编译检查、spotless、Android Lint、帮助文档校验）
        # 全部 skipped——2026-11 的 8 次运行全是这个死法，CI 从未真正编译过一次代码。
        #
        # 这 7 条旧提交不改写：其中 da2df3a3 / cd302c08 被 release-3.26.110120 等
        # tag 指着，改写会让 tag 脱离分支，代价远大于收益。
        #
        # 改用 github.event.before（本次 push 之前的分支尖端）作为起点，
        # 这样既有真实信号（新提交不合规会被点名），又不会被历史提交永久拖红。
        #
        # ## 为什么 continue-on-error
        # 提交信息是书写习惯问题，不影响产物正确性，不该挡住编译检查。
        # 与下面 spotless 的处理保持一致：只警示，不阻塞。
        continue-on-error: true
        run: |
          BEFORE="${{ github.event.before }}"
          if git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            echo "== 校验本次推送新增的提交：$BEFORE..HEAD"
            git log --oneline "$BEFORE"..HEAD | cat
            npx --no -- commitlint --from "$BEFORE" --to HEAD
          else
            # 首次推送、强制推送（before 为全 0）或 rebase 后拿不到起点，退回只校验最新一条
            echo "== 无法确定推送起点，只校验最近一条提交"
            git log -1 --format=%B | npx --no -- commitlint
          fi

      - name: Run Compile Check
        run: |
          chmod +x gradlew
          # 只执行编译源码任务，不打包，最快速度验证 Kotlin 语法和依赖情况
          ./gradlew compileDebugSources --parallel --daemon --warning-mode all

      - name: Kotlin Format Check (spotless/ktlint)
        # 可选检查：格式问题不阻塞 CI，仅警示；本地修正 ./gradlew spotlessApply
        continue-on-error: true
        run: |
          ./gradlew spotlessCheck --parallel --daemon --warning-mode all

      - name: Android Lint
        # 主线 flavor 单变体，避免全矩阵 lint 拖慢 CI
        run: |
          ./gradlew :app:lintAppMaxDebug --daemon --warning-mode all

      - name: Help Doc Map Verify
        # 校验 docs/help-doc-sync/map.json 的映射仍有效（本地 pre-commit 的 CI 兜底）
        run: |
          node scripts/help-doc-sync.mjs --verify